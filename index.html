<!doctype html>
<html lang="ca">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#101010" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="LifeHub" />
  <link rel="manifest" href="manifest.webmanifest?v=64" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <title>LifeHub</title>
  <link rel="stylesheet" href="styles.css?v=64" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark">L</div>
        <div>
          <strong>LifeHub</strong>
          <span>Tot sota control</span>
        </div>
      </div>

      <nav class="nav">
        <button class="nav-item active" data-view="dashboard">
          <span class="nav-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="3.5" width="7" height="4.5" rx="1.5"/><rect x="13.5" y="10.5" width="7" height="10" rx="1.5"/><rect x="3.5" y="13" width="7" height="7.5" rx="1.5"/></svg></span>
          <span class="nav-label">Dashboard</span>
        </button>
        <button class="nav-item" data-view="subscriptions">
          <span class="nav-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="M3 10h18"/><path d="M7 15h4"/><path d="M16.5 13.5v3M15 15h3"/></svg></span>
          <span class="nav-label">Subscripcions</span>
        </button>
        <button class="nav-item" data-view="quotes">
          <span class="nav-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M9 10.2c0-1.3 1.2-2.2 3-2.2s3 .9 3 2.2-1 1.9-3 2.2-3 1-3 2.3 1.2 2.3 3.1 2.3 3.1-1 3.1-2.3M12 6.2v11.6"/></svg></span>
          <span class="nav-label">Quotes</span>
        </button>
        <button class="nav-item" data-view="warranties">
          <span class="nav-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 8h14l-1 12H6L5 8Z"/><path d="M8.5 9V6.5a3.5 3.5 0 0 1 7 0V9"/><path d="m9.2 14.5 1.8 1.8 4-4"/></svg></span>
          <span class="nav-label">Compres i garanties</span>
        </button>
        <button class="nav-item" data-view="insurance">
          <span class="nav-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 5 6v5.2c0 4.7 2.8 8.1 7 9.8 4.2-1.7 7-5.1 7-9.8V6l-7-3Z"/><path d="m8.8 12 2.1 2.1 4.4-4.4"/></svg></span>
          <span class="nav-label">Assegurances</span>
        </button>
        <button class="nav-item" data-view="maintenance">
          <span class="nav-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14.7 6.3a4.2 4.2 0 0 0-5.1 5.2L4.2 17l2.8 2.8 5.5-5.4a4.2 4.2 0 0 0 5.2-5.1l-2.8 2.8-3-3 2.8-2.8Z"/></svg></span>
          <span class="nav-label">Manteniments</span>
        </button>
        <button class="nav-item" data-view="digital">
          <span class="nav-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18"/><path d="M12 3c2.2 2.5 3.3 5.5 3.3 9S14.2 18.5 12 21"/><path d="M12 3C9.8 5.5 8.7 8.5 8.7 12S9.8 18.5 12 21"/></svg></span>
          <span class="nav-label">Dominis i digital</span>
        </button>
        <button class="nav-item" data-view="agenda">
          <span class="nav-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="3"/><path d="M8 3v4M16 3v4M3.5 10h17"/><path d="M8 14h2M14 14h2M8 17h2M14 17h2"/></svg></span>
          <span class="nav-label">Agenda</span>
        </button>
      </nav>

      <div class="sidebar-footer"></div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div>
          <p class="eyebrow">12 setembre 2026</p>
          <h1 id="page-title">Bon vespre, Paula</h1>
        </div>
        <div class="top-actions">
          <div class="global-search-wrap">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-4-4"></path></svg>
            <input id="global-search" type="search" placeholder="Cerca a LifeHub…" autocomplete="off">
            <div id="global-search-results" class="global-search-results"></div>
          </div>
          <div class="notification-wrap">
            <button class="notification-bell" id="notification-bell" aria-label="Notificacions">
              <svg viewBox="0 0 24 24"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"/><path d="M10 21h4"/></svg>
              <span id="notification-badge" class="notification-badge"></span>
            </button>
            <div id="notification-panel" class="notification-panel"></div>
          </div>
        </div>
      </header>

      <section class="filters">
        <button class="chip active" data-filter="Tots">Tots</button>
        <button class="chip" data-filter="Personal">Personal</button>
        <button class="chip" data-filter="Professional">Professional</button>
        <button class="chip" data-filter="Casa">Casa</button>
        <button class="chip" data-filter="Cotxe">Cotxe</button>
        <button class="chip" data-filter="Mascotes">Mascotes</button>
          <button class="chip" data-filter="Salut">Salut</button>
          <button class="chip add-tag-chip" id="add-tag-filter">＋</button>
      </section>

      <section id="view-container"></section>
    </main>
  </div>

  <script src="app.js?v=64"></script>
</body>
</html>
